[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-conductor"
version = "0.1.0"
description = "Local Claude export search and recall tools."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "mcp>=1.27.2",
  # zoneinfo has no system time zone database on Windows; evidence needs explicit IANA zones.
  "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.scripts]
chat-conductor = "chat_conductor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"chat_conductor.evidence" = ["schema.sql", "analysis.schema.json"]
